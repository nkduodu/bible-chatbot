<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Shepherd</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #chat-window {
      border: 1px solid #ccc;
      padding: 10px;
      height: 400px;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #f9f9f9;
    }
    .user {
      text-align: right;
      color: blue;
      margin: 5px;
    }
    .assistant {
      text-align: left;
      color: green;
      margin: 5px;
    }
    .group {
      text-align: left;
      color: purple;
      margin: 5px;
    }
    #chat-input {
      width: 70%;
      padding: 8px;
    }
    #send-btn {
      padding: 8px 12px;
    }
  </style>
</head>
<body>
  <h1>The Shepherd</h1>
  <div id="chat-window"></div>
  <input id="chat-input" type="text" placeholder="Type your question..." />
  <button id="send-btn">Send</button>

  <script>
    // Customize these names
    const USERNAME = "Nana";
    const ASSISTANT_NAME = "The Shepherd";

    async function sendMessage() {
      const userInput = document.getElementById("chat-input").value;
      if (!userInput.trim()) return;

      // Show user message
      addMessageToChat("user", userInput);

      try {
        const res = await fetch("/.netlify/functions/bible-chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userInput }),
        });

        const data = await res.json();
        const reply = data.history && data.history[0] ? data.history[0] : "No response received.";
        addMessageToChat("assistant", reply);
      } catch (err) {
        console.error(err);
        addMessageToChat("assistant", "Error: Unable to fetch response.");
      }

      document.getElementById("chat-input").value = "";
    }

    function addMessageToChat(role, text) {
      const chatWindow = document.getElementById("chat-window");
      const messageDiv = document.createElement("div");

      if (role === "user") {
        messageDiv.textContent = USERNAME + ": " + text;
        messageDiv.className = "user";
      } else if (role === "assistant") {
        messageDiv.textContent = ASSISTANT_NAME + ": " + text;
        messageDiv.className = "assistant";
      } else {
        // For group chats, pass in the participant's name as role
        messageDiv.textContent = role + ": " + text;
        messageDiv.className = "group";
      }

      chatWindow.appendChild(messageDiv);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    document.getElementById("send-btn").addEventListener("click", sendMessage);
    document.getElementById("chat-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
