<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>The Shepherd</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #chat-window {
      border: 1px solid #ccc;
      padding: 10px;
      height: 300px;
      overflow-y: auto;
      margin-bottom: 10px;
      background: #f9f9f9;
    }
    .user { text-align: right; color: blue; margin: 5px; }
    .assistant { text-align: left; color: green; margin: 5px; }
    .group { text-align: left; color: purple; margin: 5px; }
    #chat-input { width: 70%; padding: 8px; }
    #send-btn, #clear-btn { padding: 8px 12px; margin-left: 5px; }

    /* Floating widget */
    #floating-widget {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      cursor: pointer;
      z-index: 1000;
    }
    #chat-container {
      display: none;
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 350px;
      height: 450px;
      border: 1px solid #ccc;
      background: #fff;
      z-index: 999;
      padding: 10px;
    }
  </style>
</head>
<body>
  <!-- Floating SVG Bible widget -->
  <div id="floating-widget">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
      <rect x="10" y="10" width="44" height="44" fill="#8B4513" stroke="#000"/>
      <line x1="32" y1="10" x2="32" y2="54" stroke="#fff" stroke-width="2"/>
    </svg>
  </div>

  <!-- Chat container -->
  <div id="chat-container">
    <h1>The Shepherd</h1>
    <div id="chat-window"></div>
    <input id="chat-input" type="text" placeholder="Type your question..." />
    <button id="send-btn">Send</button>
    <button id="clear-btn">Clear Chat</button>
  </div>

  <script>
    const USERNAME = "Nana";
    const ASSISTANT_NAME = "The Shepherd";

    async function sendMessage() {
      const userInput = document.getElementById("chat-input").value;
      if (!userInput.trim()) return;

      addMessageToChat("user", userInput);

      try {
        const res = await fetch("/.netlify/functions/bible-chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: userInput }),
        });
        const data = await res.json();
        const reply = data.history && data.history.slice(-1)[0] ? data.history.slice(-1)[0].text : "No response.";
        addMessageToChat("assistant", reply);
      } catch (err) {
        console.error(err);
        addMessageToChat("assistant", "Error: Unable to fetch response.");
      }

      document.getElementById("chat-input").value = "";
    }

    async function loadHistory() {
      try {
        const res = await fetch("/.netlify/functions/bible-chat", { method: "GET" });
        const data = await res.json();
        if (data.history) {
          document.getElementById("chat-window").innerHTML = "";
          data.history.forEach(msg => addMessageToChat(msg.role, msg.text));
        }
      } catch (err) {
        console.error("Failed to load history", err);
      }
    }

    function addMessageToChat(role, text) {
      const chatWindow = document.getElementById("chat-window");
      const messageDiv = document.createElement("div");
      if (role === "user") {
        messageDiv.textContent = USERNAME + ": " + text;
        messageDiv.className = "user";
      } else if (role === "assistant") {
        messageDiv.textContent = ASSISTANT_NAME + ": " + text;
        messageDiv.className = "assistant";
      } else {
        messageDiv.textContent = role + ": " + text;
        messageDiv.className = "group";
      }
      chatWindow.appendChild(messageDiv);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // Toggle chat visibility
    document.getElementById("floating-widget").addEventListener("click", () => {
      const chat = document.getElementById("chat-container");
      chat.style.display = chat.style.display === "none" ? "block" : "none";
    });

    document.getElementById("send-btn").addEventListener("click", sendMessage);
    document.getElementById("chat-input").addEventListener("keypress", e => {
      if (e.key === "Enter") sendMessage();
    });

    document.getElementById("clear-btn").addEventListener("click", async () => {
      await fetch("/.netlify/functions/clear-chat", { method: "POST" });
      document.getElementById("chat-window").innerHTML = "";
    });

    window.onload = loadHistory;
  </script>
</body>
</html>
